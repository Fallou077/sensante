<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SenSante - Pre-diagnostic</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Header -->
    <header class="bg-blue-600 text-white py-4 shadow-lg">
        <div class="max-w-4xl mx-auto px-4">
            <h1 class="text-2xl font-bold">SenSante</h1>
            <p class="text-blue-100 text-sm">
                Assistant pré-diagnostic médical
            </p>
        </div>
    </header>

    <!-- Contenu principal -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Colonne gauche : formulaire -->
            <div id="form-section" class="bg-white rounded-xl shadow-md p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4">
                    Symptômes du patient
                </h2>
                <!-- Nom -->
<div class="mb-3">
    <label class="block text-sm font-medium text-gray-700 mb-1">Nom du patient</label>
    <input type="text" id="nom" 
        class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" 
        placeholder="Ex: Amadou Diallo">
</div>

                <!-- Age -->
                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Âge</label>
                    <input type="number" id="age" 
                        class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" 
                        placeholder="Ex: 28" min="0" max="120">
                </div>

                <!-- Sexe -->
                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Sexe</label>
                    <select id="sexe" class="w-full border border-gray-300 rounded-lg p-2">
                        <option value="F">Féminin</option>
                        <option value="M">Masculin</option>
                    </select>
                </div>

                <!-- Temperature -->
                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Température (°C)</label>
                    <input type="number" id="temperature" step="0.1" 
                        class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" 
                        placeholder="Ex: 38.5" min="35" max="42">
                </div>

                <!-- Tension -->
                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tension systolique</label>
                    <input type="number" id="tension_sys" 
                        class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" 
                        placeholder="Ex: 120" min="60" max="250">
                </div>

                <!-- Symptomes (checkboxes) -->
                <div class="mb-3">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Symptômes</label>
                    <div class="space-y-2">
                        <label class="flex items-center">
                            <input type="checkbox" id="toux" class="rounded text-blue-600 mr-2">
                            <span class="text-gray-700">Toux</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" id="fatigue" class="rounded text-blue-600 mr-2">
                            <span class="text-gray-700">Fatigue</span>
                        </label>
                        <label class="flex items-center">
                            <input type="checkbox" id="maux_tete" class="rounded text-blue-600 mr-2">
                            <span class="text-gray-700">Maux de tête</span>
                        </label>
                    </div>
                </div>

                <!-- Region -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Région</label>
                    <select id="region" class="w-full border border-gray-300 rounded-lg p-2">
                        <option value="Dakar">Dakar</option>
                        <option value="Thies">Thiès</option>
                        <option value="Saint-Louis">Saint-Louis</option>
                        <option value="Ziguinchor">Ziguinchor</option>
                        <option value="Tambacounda">Tambacounda</option>
                        <option value="Kaolack">Kaolack</option>
                        <option value="Diourbel">Diourbel</option>
                        <option value="Fatick">Fatick</option>
                        <option value="Kolda">Kolda</option>
                        <option value="Matam">Matam</option>
                    </select>
                </div>

                <!-- Bouton -->
                <button onclick="diagnostiquer()" id="btn-diag" 
                    class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition duration-200 shadow-md">
                    Diagnostiquer
                </button>
            </div>

            <!-- Colonne droite : resultat -->
<div id="result-section">
    <div class="bg-white rounded-xl shadow-md p-6 text-center text-gray-400 border border-dashed border-gray-200">
        <p class="text-4xl mb-3">&#129658;</p>
        <p class="font-medium text-gray-600">
            Remplissez le formulaire
        </p>
        <p class="text-sm mt-1">
            puis cliquez sur <span class="font-semibold text-blue-600">Diagnostiquer</span>
        </p>
    </div>
    <!-- Section Historique -->
<div class="bg-white rounded-xl shadow-md p-6 mt-6 border border-gray-100">
    <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
        <span></span> Historique récent
    </h2>
    <div id="historique-section" class="overflow-x-auto">
        <p class="text-sm text-gray-500 italic">Aucune consultation pour le moment.</p>
    </div>
</div>
</div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center text-gray-400 text-sm py-4">
        SenSante v0.3 - ESP / UCAD - L2 GLSI 2026
    </footer>

    <!-- JavaScript -->
    <script>
// URL de l'API (à adapter si nécessaire)
// URL de l'API FastAPI
const API_URL = "http://127.0.0.1:8000";

// --- FONCTIONS D'AFFICHAGE ---

function afficherChargement() {
    const section = document.getElementById("result-section");
    if (!section) return;
    section.innerHTML = `
        <div class="bg-white rounded-xl shadow-md p-6 text-center border border-gray-100">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
            <p class="text-gray-500 font-medium">Analyse en cours...</p>
        </div>`;
}



function afficherResultat(r) {
    // ... (code existant du Lab 4 pour afficher le diagnostic + la barre) ...

    // NOUVEAU : appeler /explain automatiquement
    demanderExplication(r);
}

async function demanderExplication(diagnostic_data) {
    // Récupérer les données du formulaire
    const explainData = {
        diagnostic: diagnostic_data.diagnostic,
        probabilite: diagnostic_data.probabilite,
        age: parseInt(document.getElementById("age").value),
        sexe: document.getElementById("sexe").value,
        temperature: parseFloat(document.getElementById("temperature").value),
        region: document.getElementById("region").value
    };

    // Zone d'explication dans le result-section
    const section = document.getElementById("result-section");
    
    // Ajouter un placeholder (zone de chargement)
    const explDiv = document.createElement("div");
    explDiv.id = "explication-zone";
    explDiv.innerHTML = `
        <div class="mt-4 bg-purple-50 rounded-lg p-4 border border-purple-200">
            <p class="text-sm text-purple-600 font-medium mb-2">Explication (Llama 3)</p>
            <p class="text-gray-500 text-sm animate-pulse">Génération en cours ...</p>
        </div>
    `;
    section.querySelector(".bg-white").appendChild(explDiv);

    try {
        const response = await fetch(API_URL + "/explain", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(explainData)
        });

        if (response.ok) {
            const result = await response.json();
            explDiv.innerHTML = `
                <div class="mt-4 bg-purple-50 rounded-lg p-4 border border-purple-200">
                    <p class="text-sm text-purple-600 font-medium mb-2">Explication (Llama 3)</p>
                    <p class="text-gray-700 text-sm leading-relaxed">${result.explication}</p>
                </div>
            `;
        }
    } catch (error) {
        explDiv.innerHTML = `
            <div class="mt-4 bg-gray-50 rounded-lg p-3">
                <p class="text-gray-400 text-sm">Explication non disponible.</p>
            </div>
        `;
    }
}
            
function afficherErreur(msg) {
    const section = document.getElementById("result-section");
    if (!section) return;
    section.innerHTML = `
        <div class="bg-red-50 border border-red-200 rounded-xl p-6">
            <p class="text-red-700 font-bold">Erreur</p>
            <p class="text-red-600 text-sm mt-1">${msg}</p>
        </div>`;
}
// 1. Initialisation du tableau global pour l'historique
const historique = [];

// 2. Fonction pour mettre à jour et afficher l'historique
function ajouterAHistorique(nom, diagnostic, probabilite) {
    const conteneur = document.getElementById("historique-section");
    
    // Si le nom est vide, on met "Anonyme"
    const nomPatient = nom.trim() !== "" ? nom : "Anonyme";
    const pct = Math.round(probabilite * 100) + "%";

    // Ajouter la nouvelle consultation au DÉBUT du tableau (unshift)
    historique.unshift({
        nom: nomPatient,
        diagnostic: diagnostic,
        probabilite: pct
    });

    // Garder uniquement les 5 derniers éléments
    if (historique.length > 5) {
        historique.pop(); // Retire le dernier élément (le plus ancien)
    }

    // 3. Générer le HTML du tableau dynamiquement
    let htmlTableau = `
        <table class="min-w-full text-left text-sm whitespace-nowrap">
            <thead class="uppercase tracking-wider border-b-2 border-gray-200 bg-gray-50 text-gray-600">
                <tr>
                    <th class="px-4 py-3">Patient</th>
                    <th class="px-4 py-3">Diagnostic</th>
                    <th class="px-4 py-3">Probabilité</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
    `;

    // Boucle pour créer une ligne (tr) pour chaque élément de l'historique
    historique.forEach(consult => {
        htmlTableau += `
            <tr class="hover:bg-gray-50 transition-colors">
                <td class="px-4 py-3 font-medium text-gray-900">${consult.nom}</td>
                <td class="px-4 py-3 text-gray-600 capitalize">${consult.diagnostic}</td>
                <td class="px-4 py-3">
                    <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">
                        ${consult.probabilite}
                    </span>
                </td>
            </tr>
        `;
    });

    htmlTableau += `</tbody></table>`;

    // Injecter le tableau généré dans la page HTML
    conteneur.innerHTML = htmlTableau;
}

// --- FONCTION PRINCIPALE ---

async function diagnostiquer() {
    console.log("Appel de la fonction diagnostiquer...");

    // 1. Récupération des éléments (on vérifie s'ils existent)
    const elAge = document.getElementById("age");
    const elTemp = document.getElementById("temperature");
    const elTension = document.getElementById("tension_sys");

    if (!elAge || !elTemp || !elTension) {
        console.error("Un ou plusieurs champs du formulaire sont introuvables dans le HTML.");
        return;
    }

    const patient = {
        age: parseInt(elAge.value),
        sexe: document.getElementById("sexe").value,
        temperature: parseFloat(elTemp.value),
        tension_sys: parseInt(elTension.value),
        toux: document.getElementById("toux").checked,
        fatigue: document.getElementById("fatigue").checked,
        maux_tete: document.getElementById("maux_tete").checked,
        region: document.getElementById("region").value
    };

    // 2. Validation simple
    if (isNaN(patient.age) || isNaN(patient.temperature)) {
        alert("Veuillez remplir l'âge et la température.");
        return;
    }

    // 3. Interface de chargement
    afficherChargement();

    try {
        console.log("Envoi des données à l'API...", patient);
        const response = await fetch(`${API_URL}/predict`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(patient)
        });

        if (!response.ok) {
            throw new Error("Le serveur a répondu avec une erreur.");
        }

        const resultat = await response.json();
        console.log("Réponse reçue :", resultat);
        
        // Petit délai pour l'effet visuel
        setTimeout(() => {
            afficherResultat(resultat);
        }, 500);

    } catch (error) {
        console.error("Erreur lors de l'appel API:", error);
        afficherErreur("Impossible de contacter l'API. Vérifiez qu'Uvicorn est lancé sur le port 8000.");
    }
}
   
       
      


    </script>
    

</body>
</html>
